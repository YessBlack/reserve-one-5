<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Catálogo - Lan Hua</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
    rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.0/css/all.min.css"
    integrity="sha512-ApSLB1Pd3/bZN8fWB/RG9YhN/7bd9Hkf3AGaE2mPfebjrxagjuBtx2GcgdqIlJkUzwylBo61r9Xa9NmgBI0swA=="
    crossorigin="anonymous" referrerpolicy="no-referrer" />
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <link rel="stylesheet" href="../../shared/css/reset.css">
  <link rel="stylesheet" href="../../shared/css/variables.css">
  <link rel="stylesheet" href="../../shared/components/Header/Header.css">
  <link rel="stylesheet" href="catalog.css">
  <link rel="stylesheet" href="components/CatalogItemCard/CatalogItemCard.css">
  <link rel="stylesheet" href="../../shared/components/Alert/Alert.css">
  <link rel="stylesheet" href="../../shared/components/UserMenu/UserMenu.css">

  <script src="../../shared/js/authGuard.js" type="module" defer></script>
  <script type="module" defer>
    import { requireAdmin } from '../../shared/js/authGuard.js'
    requireAdmin()
  </script>
</head>

<body style="visibility: hidden;">
  <header class="header sticky-top">
    <div class="container">
      <nav class="navbar navbar-expand-lg px-0">

        <a class="navbar-brand d-flex align-items-center" href="../dashboard/dashboard.html">
          <img src="../../assets/LogoSinFondo.png" class="logo">
          <span class="ms-2 fw-semibold brand-name">
            LAN HUA
          </span>
        </a>
        <button class="navbar-toggler border-0 shadow-none" type="button" data-bs-toggle="collapse"
          data-bs-target="#adminNavbar">
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse justify-content-between" id="adminNavbar">
          <ul class="navbar-nav mx-auto">
            <li class="nav-item">
              <a class="nav-link" href="../dashboard/dashboard.html">Dashboard</a>
            </li>

            <li class="nav-item">
              <a class="nav-link active" href="catalog.html">Catálogo</a>
            </li>

            <li class="nav-item">
              <a class="nav-link" href="../daylie/daylie.html">Agenda</a>
            </li>

            <li class="nav-item">
              <a class="nav-link" href="../admin_users/admin_users.html">Usuarios</a>
            </li>

          </ul>

          <div class="d-flex flex-column flex-lg-row gap-3">
            <div id="authNavContainer"></div>
          </div>

        </div>
      </nav>
    </div>
  </header>

  <main>
    <div class="container">
      <div
        class="d-flex flex-column flex-sm-row align-items-start align-items-sm-center justify-content-between gap-3 mt-4 dashboardHeader">
        <div>
          <h1 class="h2 mb-1">Catálogo de Programas</h1>
          <p class="fst-italic small text-muted mb-0">
            Crea, organiza y gestiona los programas, diciplinas y eventos del club LanHua.
          </p>
        </div>
        <button class="btnAddProgram" id="addProgram" data-bs-toggle="modal" data-bs-target="#catalogModal">
          <i class="fa-solid fa-plus small"></i>
          Agregar Programa
        </button>
      </div>

      <div class="cards mt-4 row g-4" id="catalogContainer"></div>

      <div class="modal fade" id="catalogModal" data-bs-backdrop="static" data-bs-keyboard="false" tabindex="-1"
        aria-labelledby="catalogModalLabel" aria-hidden="true">
        <div class="modal-dialog">
          <div class="modal-content">
          </div>
        </div>
      </div>

    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
    crossorigin="anonymous"></script>
  <script src="catalog.js" type="module"></script>

  <script type="module">
    import { loadUserMenu } from '../../shared/components/UserMenu/UserMenu.js'
    import { requireAdmin } from '../../shared/js/authGuard.js'

    document.addEventListener('DOMContentLoaded', () => {
      if (requireAdmin()) {
        loadUserMenu()
      }
    })
  </script>
</body>

</html>
