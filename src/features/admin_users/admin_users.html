<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Usuarios</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
    rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    crossorigin="anonymous" referrerpolicy="no-referrer" />
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

  <link rel="stylesheet" href="../../shared/css/reset.css">
  <link rel="stylesheet" href="../../shared/css/variables.css">
  <link rel="stylesheet" href="../../shared/components/Header/Header.css">
  <link rel="stylesheet" href="../../shared/components/UserMenu/UserMenu.css">
  <link rel="stylesheet" href="../../shared/components/Alert/Alert.css">
  <link rel="stylesheet" href="admin_users.css">

  <script src="../../shared/js/authGuard.js" type="module" defer></script>
  <script type="module" defer>
    import { requireAdmin } from '../../shared/js/authGuard.js'
    requireAdmin()
  </script>
</head>

<body style="visibility: hidden;">
  <header class="header sticky-top">
    <div class="container">
      <nav class="navbar navbar-expand-lg px-0">

        <a class="navbar-brand d-flex align-items-center" href="../dashboard/dashboard.html">
          <img src="../../assets/LogoSinFondo.png" class="logo" alt="Logo Lan Hua">
          <span class="ms-2 fw-semibold brand-name">LAN HUA</span>
        </a>

        <button class="navbar-toggler border-0 shadow-none" type="button" data-bs-toggle="collapse"
          data-bs-target="#navbar">
          <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse justify-content-between" id="navbar">
          <ul class="navbar-nav mx-auto">
            <li class="nav-item">
              <a class="nav-link" href="../dashboard/dashboard.html">Dashboard</a>
            </li>

            <li class="nav-item">
              <a class="nav-link" href="../catalog/catalog.html">Catálogo</a>
            </li>

            <li class="nav-item">
              <a class="nav-link" href="../daylie/daylie.html">Agenda</a>
            </li>

            <li class="nav-item">
              <a class="nav-link active" href="admin_users.html">Usuarios</a>
            </li>

          </ul>

          <div class="d-flex flex-column flex-lg-row gap-3">
            <div id="authNavContainer"></div>
          </div>
        </div>

      </nav>
    </div>
  </header>

  <main>
    <div class="container">

      <div class="mt-4 mb-4">
        <h1 class="h2 mb-1">Usuarios</h1>
        <p class="fst-italic small text-muted mb-0">
          Crea, organiza y administra los usuarios administradores del Club LanHua de forma sencilla.
        </p>
      </div>

      <div class="">
        <div class="card-header bg-white border-0 d-flex py-3">
          <button class="btnAddSchedule" id="addProgram" data-bs-toggle="modal" data-bs-target="#adminUsersModal">
            <i class="fa-solid fa-plus small"></i>
            Agregar Usuario
          </button>
        </div>

        <div class="table-responsive rounded-4">
          <table class="table table-soft-border table-hover align-middle mb-0">
            <thead class="bg-light">
              <tr>
                <th scope="col" class="table-column"></th>
                <th scope="col" class="table-column">Nombre de Usuario</th>
                <th scope="col" class="table-column">Correo</th>
                <th scope="col" class="table-column">Rol</th>
                <th scope="col" class="table-column">Creado</th>
              </tr>
            </thead>
            <tbody id="tableBody">
            </tbody>
          </table>
        </div>
      </div>

      <div class="modal fade" id="adminUsersModal" data-bs-backdrop="static" data-bs-keyboard="false" tabindex="-1"
        aria-labelledby="adminUsersModalLabel" aria-hidden="true">
        <div class="modal-dialog">
          <div class="modal-content">
            <div class="modal-header">
              <h5 class="modal-title" id="adminUsersModalLabel">Agregar Usuario</h5>
              <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>

            <form id="userForm">
              <div class="modal-body">
                <input type="hidden" id="userId">

                <div class="mb-3">
                  <label for="userNombre" class="form-label">Nombre</label>
                  <input type="text" class="form-control" id="userNombre" placeholder="Ej. María" required>
                </div>

                <div class="mb-3">
                  <label for="userApellido" class="form-label">Apellido</label>
                  <input type="text" class="form-control" id="userApellido" placeholder="Ej. González" required>
                </div>

                <div class="mb-3">
                  <label for="userEmail" class="form-label">Correo</label>
                  <input type="email" class="form-control" id="userEmail" placeholder="usuario@lanhua.com" required>
                </div>

                <div class="mb-3">
                  <label for="userPassword" class="form-label">Contraseña</label>
                  <input type="password" class="form-control" id="userPassword" placeholder="Mínimo 8 caracteres">
                  <div class="form-text" id="passwordHint">Déjala en blanco para no cambiarla.</div>
                </div>
              </div>

              <div class="modal-footer justify-content-between">
                <button type="button" class="btn btn-outline-danger d-none" id="btnDeleteUser">
                  <i class="fa-solid fa-trash small"></i>
                  Eliminar
                </button>
                <div class="ms-auto d-flex gap-2">
                  <button type="submit" class="btn btnAddSchedule">Guardar</button>
                </div>
              </div>
            </form>
          </div>
        </div>
      </div>

    </div>
  </main>


  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
    crossorigin="anonymous"></script>
  <script src="admin_users.js" type="module"></script>

  <script type="module">
    import { loadUserMenu } from '../../shared/components/UserMenu/UserMenu.js'
    import { requireAdmin } from '../../shared/js/authGuard.js'

    document.addEventListener('DOMContentLoaded', () => {
      if (requireAdmin()) {
        loadUserMenu()
      }
    })
  </script>
</body>

</html>
