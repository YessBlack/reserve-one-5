<html lang="es">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
    rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.0/css/all.min.css" />

  <link rel="stylesheet" href="/src/shared/css/reset.css" />
  <link rel="stylesheet" href="/src/shared/css/variables.css" />
  <link rel="stylesheet" href="/src/shared/components/Header/Header.css" />
  <link rel="stylesheet" href="/src/features/trial/trial.css" />
</head>

<body>
  <header class="header sticky-top">
    <div class="container">
      <nav class="navbar navbar-expand-lg px-0">
        <a class="navbar-brand d-flex align-items-center" href="../../index.html">
          <img src="../../assets/LogoSinFondo.png" class="logo" alt="Logo" />
          <span class="ms-2 fw-semibold brand-name">LAN HUA</span>
        </a>

        <button class="navbar-toggler border-0 shadow-none" type="button" data-bs-toggle="collapse"
          data-bs-target="#navbar">
          <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse justify-content-between" id="navbar">
          <ul class="navbar-nav mx-auto">
            <li class="nav-item">
              <a class="nav-link" href="../../index.html">Inicio</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="../about/about.html">Nosotros</a>
            </li>
            <li class=" nav-item">
              <a class="nav-link" href="../catalog_users/catalog_user.html">Clases</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="/src/features/pricing/pricing.html">Precios</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="../landing/contact/contact.html">Contacto</a>
            </li>
          </ul>

          <div class="d-flex flex-column flex-lg-row gap-3">
            <a href="/src/features/catalog_users/catalog_user.html" class="flex-fill">
              <button class="btnBooking w-100">Reserva tu Clase</button>
            </a>
            <a href="/src/features/auth/auth.html" class="flex-fill" id="authNavLink">
              <button class="btnLogin w-100" id="authNavBtn">
                Ingresar
              </button>
            </a>
          </div>
        </div>
      </nav>
    </div>
  </header>

  <main id="app">
    <section class="contact py-4" id="contact">
      <div class="container">
        <div class="row justify-content-center">
          <div class="col-lg-6">

            <div class="card border-0 p-4 p-md-5 shadow-lg text-white" style="background-color: rgba(0, 0, 0, 0.62)">
              <div class="text-center mb-1">
                <h2 class="fw-bold" style="color: #f2be22">Reserva tu clase de cortesía</h2>
              </div>
              <form id="trialForm" action="https://formspree.io/f/mdaqqqyv" method="POST">
                <div class="mb-3">
                  <label for="nombre" class="form-label small text-warning">Nombre completo</label>
                  <input type="text" class="form-control bg-secondary text-white border-0" id="nombre" name="nombre"
                    placeholder="Ej. Sebastian Cardona" required />
                </div>

                <div class="mb-3">
                  <label for="correo" class="form-label small text-warning">Correo electrónico</label>
                  <input type="email" class="form-control bg-secondary text-white border-0" id="correo" name="correo"
                    placeholder="correo@ejemplo.com" required />
                </div>

                <div class="mb-2">
                  <label for="telefono" class="form-label small text-warning">Teléfono / Celular</label>
                  <input type="tel" class="form-control bg-secondary text-white border-0" id="telefono" name="telefono"
                    placeholder="+57 300 000 0000" required />
                </div>

                <div class="mb-2">
                  <label for="location" class="form-label small text-warning">Sede</label>
                  <select class="form-select bg-secondary text-white border-0" id="location" name="location" required>
                    <option value="" selected disabled style="color: #adb5bd">Seleccionar Sede</option>
                    <option value="Sede Laureles">Sede Laureles</option>
                    <option value="Sede Monterrey">Sede Monterrey</option>
                    <option value="Sede Haru no Hinata">Sede Haru no Hinata</option>
                  </select>
                </div>

                <div class="mb-4">
                  <label for="availableschedule" class="form-label small text-warning">Horario</label>
                  <select class="form-select bg-secondary text-white border-0" id="availableschedule"
                    name="availableschedule" required>
                    <option value="" selected disabled style="color: #adb5bd">
                      Seleccionar Horario
                    </option>
                    <!-- TO DO: en la lista desplegable aparescan solo opciones de clases publicadas segun la sede escogida en el label anterior -->
                    <option value="horario">Horario 8pm</option>
                  </select>
                </div>

                <div class="d-grid ">
                  <button type="submit" class="btn fw-bold py-2" style="background-color: #f2be22; color: #0d0d0d">
                    Enviar Reserva
                  </button>
                  <!--todo: enviar un correo o mensaje de confirmacion de la clase-->
                </div>
              </form>
            </div>
          </div>
        </div>
      </div>
    </section>
  </main>

  <div id="footer-container"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
  <script type="module">
    import { loadFooter } from '../../shared/components/Footer/Footer.js';
    import { initAuthNav } from '../../shared/js/authNav.js';

    document.addEventListener("DOMContentLoaded", () => {
      loadFooter();
      initAuthNav();
    });
  </script>
  <script src="/src/features/trial/trial.js" type="module"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</body>

</html>
