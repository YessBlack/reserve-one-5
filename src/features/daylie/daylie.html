<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mi Agenda - Lan Hua</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <link rel="stylesheet" href="../../shared/css/reset.css">
  <link rel="stylesheet" href="../../shared/css/variables.css">
  <link rel="stylesheet" href="../../shared/components/Header/Header.css">
  <link rel="stylesheet" href="../../shared/components/UserMenu/UserMenu.css">
  <link rel="stylesheet" href="../../shared/components/WarningUpdate/WarningUpdate.css">
  <link rel="stylesheet" href="daylie.css">
</head>

<body class="d-flex flex-column min-vh-100">
  <script>
    try {
      const session = JSON.parse(localStorage.getItem('lanhua_session'))
      document.body.classList.add(session?.role === 'admin' ? 'agenda-admin' : 'agenda-user')
    } catch {
      document.body.classList.add('agenda-user')
    }
  </script>

  <div id="headerWrapper">
    <header id="clientHeader" class="header sticky-top d-none">
      <div class="container">
        <nav class="navbar navbar-expand-lg px-0">
          <a class="navbar-brand d-flex align-items-center" href="../../index.html">
            <img src="../../assets/LogoSinFondo.png" class="logo" alt="Logo Lan Hua">
            <span class="ms-2 fw-semibold brand-name">LAN HUA</span>
          </a>
          <button class="navbar-toggler border-0 shadow-none" type="button" data-bs-toggle="collapse"
            data-bs-target="#userNavbar">
            <span class="navbar-toggler-icon"></span>
          </button>
          <div class="collapse navbar-collapse justify-content-between" id="userNavbar">
            <ul class="navbar-nav mx-auto">
              <li class="nav-item"><a class="nav-link" href="../../index.html">Inicio</a></li>
              <li class="nav-item"><a class="nav-link" href="../about/about.html">Nosotros</a></li>
              <li class="nav-item"><a class="nav-link" href="../catalog_users/catalog_user.html">Clases</a></li>
              <li class="nav-item"><a class="nav-link" href="../pricing/pricing.html">Precios</a></li>
              <li class="nav-item"><a class="nav-link" href="../contact/contact.html">Contacto</a></li>
            </ul>
            <div class="d-flex flex-column flex-lg-row align-items-lg-center gap-3">
              <a href="../catalog_users/catalog_user.html" class="flex-fill">
                <button class="btnBooking w-100">Reserva tu Clase</button>
              </a>
              <div class="flex-fill" id="authNavContainer" style="min-width: 120px; min-height: 40px;"></div>
            </div>
          </div>
        </nav>
      </div>
    </header>

    <header class="header sticky-top d-none" id="adminHeader">
      <div class="container">
        <nav class="navbar navbar-expand-lg px-0">
          <a class="navbar-brand d-flex align-items-center" href="../dashboard/dashboard.html">
            <img src="../../assets/LogoSinFondo.png" class="logo" alt="Logo Lan Hua">
            <span class="ms-2 fw-semibold brand-name">LAN HUA</span>
          </a>
          <button class="navbar-toggler border-0 shadow-none" type="button" data-bs-toggle="collapse"
            data-bs-target="#adminNavbar">
            <span class="navbar-toggler-icon"></span>
          </button>
          <div class="collapse navbar-collapse justify-content-between" id="adminNavbar">
            <ul class="navbar-nav mx-auto">
              <li class="nav-item">
                <a class="nav-link" href="../dashboard/dashboard.html">Dashboard</a>
              </li>

              <li class="nav-item">
                <a class="nav-link" href="../catalog/catalog.html">Catálogo</a>
              </li>

              <li class="nav-item">
                <a class="nav-link active" href="daylie.html">Agenda</a>
              </li>

              <li class="nav-item">
                <a class="nav-link" href="../admin_users/admin_users.html">Usuarios</a>
              </li>

            </ul>

            <div class="d-flex flex-column flex-lg-row gap-3">
              <div id="authNavContainerAdmin"></div>
            </div>

          </div>
        </nav>
      </div>
    </header>
  </div>

  <main class="container py-4 flex-grow-1">
    <div class="mb-4 daylie-header">
      <h2 class="text-warning fw-bold m-0" id="daylieTitle">Mi Agenda de Entrenamiento</h2>
      <p class="fst-italic small text-muted mb-0 mt-1" id="daylieDescription">
        Consulta las clases que has reservado en el Club LanHua.
      </p>
    </div>

    <div class="row g-4">
      <div class="col-lg-4 order-2 order-lg-1">
        <div class="card p-4 shadow-sm border-warning bg-card-custom h-100" id="classesCard">
          <h4 class="text-warning mb-2">Clases del Día</h4>
          <p class="small mb-3 border-bottom pb-2 daylie-subtitle" id="selectedDateText">Selecciona un día
          </p>

          <div id="agendaList" class="d-flex flex-column gap-3 overflow-auto" style="max-height: 600px;">
          </div>
        </div>
      </div>

      <div class="col-lg-8 order-1 order-lg-2">
        <div class="card calendar-panel p-3" id="calendarCard">

          <div class="d-flex justify-content-between align-items-center mb-3">
            <button class="btn btn-outline-warning btn-sm" id="prevMonth"><i
                class="fa-solid fa-chevron-left"></i></button>
            <h5 class="m-0 fw-bold daylie-month" id="monthYearDisplay">Mes Año</h5>
            <button class="btn btn-outline-warning btn-sm" id="nextMonth"><i
                class="fa-solid fa-chevron-right"></i></button>
          </div>

          <div class="calendar-days-header">
            <div>Dom</div>
            <div>Lun</div>
            <div>Mar</div>
            <div>Mié</div>
            <div>Jue</div>
            <div>Vie</div>
            <div>Sáb</div>
          </div>

          <div id="calendarGrid" class="calendar-grid">
          </div>

        </div>
      </div>
    </div>
  </main>

  <div id="footer-container"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

  <script type="module">
    import { loadFooter } from '../../shared/components/Footer/Footer.js';
    import { loadUserMenu } from '../../shared/components/UserMenu/UserMenu.js';
    import { initWarningUpdate } from '../../shared/components/WarningUpdate/WarningUpdate.js';

    document.addEventListener('DOMContentLoaded', () => {
      const session = JSON.parse(window.localStorage.getItem('lanhua_session'));
      if (session) {
        if (session.role === 'ADMIN') {
          loadUserMenu('authNavContainerAdmin');
        } else {
          loadUserMenu('authNavContainer');
          initWarningUpdate();
          loadFooter();
        }
      }
    })
  </script>

  <script src="daylie.js" type="module"></script>
</body>

</html>
