<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mis Reservas - Lan Hua</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
    rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.0/css/all.min.css"
    integrity="sha512-ApSLB1Pd3/bZN8fWB/RG9YhN/7bd9Hkf3AGaE2mPfebjrxagjuBtx2GcgdqIlJkUzwylBo61r9Xa9NmgBI0swA=="
    crossorigin="anonymous" referrerpolicy="no-referrer" />

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.0/css/all.min.css"
    integrity="sha512-ApSLB1Pd3/bZN8fWB/RG9YhN/7bd9Hkf3AGaE2mPfebjrxagjuBtx2GcgdqIlJkUzwylBo61r9Xa9NmgBI0swA=="
    crossorigin="anonymous" referrerpolicy="no-referrer" />

  <link rel="stylesheet" href="../../shared/css/reset.css">
  <link rel="stylesheet" href="../../shared/css/variables.css">
  <link rel="stylesheet" href="../landing/landing.css">
  <link rel="stylesheet" href="../../shared/components/Header/Header.css">
  <link rel="stylesheet" href="reservations.css">
  <link rel="stylesheet" href="../../shared/components/UserMenu/UserMenu.css">
  <link rel="stylesheet" href="../../shared/components/WarningUpdate/WarningUpdate.css">
</head>

<body class="bg-dark text-light d-flex flex-column min-vh-100">

  <header class="header sticky-top">
    <div class="container">
      <nav class="navbar navbar-expand-lg px-0">

        <a class="navbar-brand d-flex align-items-center" href="../../index.html">
          <img src="../../assets/LogoSinFondo.png" class="logo" alt="Logo Lan Hua">
          <span class="ms-2 fw-semibold brand-name">
            LAN HUA
          </span>
        </a>

        <button class="navbar-toggler border-0 shadow-none" type="button" data-bs-toggle="collapse"
          data-bs-target="#navbar">
          <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse justify-content-between" id="navbar">
          <ul class="navbar-nav mx-auto">
            <li class="nav-item">
              <a class="nav-link" href="../../index.html">Inicio</a>
            </li>

            <li class="nav-item">
              <a class="nav-link" href="../about/about.html">Nosotros</a>
            </li>

            <li class=" nav-item">
              <a class="nav-link" href="../catalog_users/catalog_user.html">Clases</a>
            </li>

            <li class="nav-item">
              <a class="nav-link" href="/src/features/pricing/pricing.html">Precios</a>
            </li>

            <li class="nav-item">
              <a class="nav-link" href="../contact/contact.html">Contacto</a>
            </li>
          </ul>

          <div class="d-flex flex-column flex-lg-row align-items-lg-center gap-3">
            <a href="../catalog_users/catalog_user.html" class="flex-fill">
              <button class="btnBooking w-100">
                Reserva tu Clase
              </button>
            </a>
            <div class="flex-fill" id="authNavContainer" style="min-width: 120px; min-height: 40px;"></div>
          </div>
        </div>

      </nav>
    </div>
  </header>

  <main class="container py-5 flex-grow-1">
    <div class="d-flex justify-content-between align-items-center mb-4 border-bottom border-secondary pb-3">
      <h2 class="text-warning fw-bold m-0">Confirma tu reserva</h2>
      <span id="contador-badge" class="badge bg-warning text-dark fs-6 px-3 py-2">0 clases</span>
    </div>

    <div class="row g-4">
      <div class="col-lg-8">
        <div id="lista-reservas" class="d-flex flex-column gap-3">
        </div>

        <div id="contenedor-vaciar" class="mt-3 d-none">
          <button class="btn btn-outline-danger btn-sm fw-bold" onclick="vaciarReservas()">
            Cancelar todas las clases agregadas
          </button>
        </div>
      </div>

      <div class="col-lg-4">
        <div class="card p-4 shadow-sm border-warning bg-card-custom">
          <h4 class="text-warning mb-3">Confirmar asistencia</h4>
          <hr class="border-secondary">

          <div id="resumen-clases" class="mb-3">
            <p class="text-secondary small mb-0">No hay clases seleccionadas.</p>
          </div>

          <div class="d-flex justify-content-between mb-3 fs-5">
            <span>Total de cupos:</span>
            <strong id="total-reservas" class="text-warning">0</strong>
          </div>

          <button class="btn btn-danger w-100 fw-bold py-2 shadow-sm" onclick="confirmarReservas()">
            Confirmar asistencia
          </button>
        </div>
      </div>
    </div>
  </main>

  <div id="footer-container"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
    crossorigin="anonymous"></script>

  <script type="module">
    import { loadFooter } from '../../shared/components/Footer/Footer.js';
    import { initAuthNav } from '../../shared/js/authNav.js';
    import { loadUserMenu } from '../../shared/components/UserMenu/UserMenu.js';
    import { initWarningUpdate } from '../../shared/components/WarningUpdate/WarningUpdate.js';

    document.addEventListener("DOMContentLoaded", () => {
      loadFooter();
      initAuthNav();
      loadUserMenu();
      initWarningUpdate();
    });
  </script>

  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script src="reservations.js" type="module"></script>
</body>

</html>
